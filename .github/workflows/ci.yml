name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Build, tests, and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - name: Run host tests
        run: bash test.sh
      - name: Enforce installer line and branch coverage
        run: bash scripts/test-python-coverage.sh
      - name: Enforce Java line and branch coverage
        run: bash scripts/test-coverage.sh
      - name: Build and validate APK
        run: |
          bash build.sh
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump permissions build/jellyfish-drift.apk
          if "$ANDROID_HOME/build-tools/36.0.0/aapt" dump permissions build/jellyfish-drift.apk | grep -q android.permission.INTERNET; then
            echo 'The screensaver must not request network access.' >&2
            exit 1
          fi
